<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="devops-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a1a" />
      <stop offset="100%" stop-color="#140f2d" />
    </linearGradient>
    <linearGradient id="cube-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <pattern id="dev-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <rect width="400" height="160" fill="url(#devops-grad)" />
  <rect width="400" height="160" fill="url(#dev-grid)" />

  <!-- Isometric Container Pods & Pipeline Nodes -->
  <g transform="translate(200, 80)">
    <!-- Center Isometric Cube (Pod Master) -->
    <g transform="translate(0, -5)">
      <!-- Top Face -->
      <polygon points="0,-24 24,-12 0,0 -24,-12" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" />
      <!-- Left Face -->
      <polygon points="-24,-12 0,0 0,26 -24,14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
      <!-- Right Face -->
      <polygon points="0,0 24,-12 24,14 0,26" fill="#172554" stroke="#00f0ff" stroke-width="1.5" />
      <!-- Inner Glow Logo / Pod Symbol -->
      <circle cx="0" cy="0" r="4" fill="#00f0ff" />
    </g>

    <!-- Left Child Container Cube -->
    <g transform="translate(-70, 15) scale(0.65)">
      <polygon points="0,-24 24,-12 0,0 -24,-12" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" />
      <polygon points="-24,-12 0,0 0,26 -24,14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
      <polygon points="0,0 24,-12 24,14 0,26" fill="#172554" stroke="#8b5cf6" stroke-width="1.5" />
    </g>

    <!-- Right Child Container Cube -->
    <g transform="translate(70, 15) scale(0.65)">
      <polygon points="0,-24 24,-12 0,0 -24,-12" fill="#1e1b4b" stroke="#00f0ff" stroke-width="1.5" />
      <polygon points="-24,-12 0,0 0,26 -24,14" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5" />
      <polygon points="0,0 24,-12 24,14 0,26" fill="#172554" stroke="#00f0ff" stroke-width="1.5" />
    </g>

    <!-- CI/CD Connecting Pipeline Conduits -->
    <path d="M -70,15 Q -35,-10 0,-5" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,3" />
    <path d="M 0,-5 Q 35,-10 70,15" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="-130" y1="15" x2="-70" y2="15" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="-130" cy="15" r="3" fill="#8b5cf6" />
    <line x1="70" y1="15" x2="130" y2="15" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="130" cy="15" r="3" fill="#00f0ff" />
  </g>

  <!-- Technical Corner Accents -->
  <path d="M 8,20 L 8,8 L 20,8" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 392,20 L 392,8 L 380,8" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 8,140 L 8,152 L 20,152" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 392,140 L 392,152 L 380,152" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
