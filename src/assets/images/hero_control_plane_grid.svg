<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Deep Cybersecurity Radial & Linear Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="40%" stop-color="#081329" />
      <stop offset="80%" stop-color="#0c1d3d" />
      <stop offset="100%" stop-color="#050a17" />
    </linearGradient>

    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#0080ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="violet-glow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1" fill="#00f0ff" fill-opacity="0.2" />
    </pattern>

    <pattern id="dot-matrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />
  <rect width="1200" height="400" fill="url(#cyan-glow)" />
  <rect width="1200" height="400" fill="url(#violet-glow)" />
  <rect width="1200" height="400" fill="url(#tech-grid)" />
  <rect width="1200" height="400" fill="url(#dot-matrix)" opacity="0.7" />

  <!-- Abstract Geometry & Cybersecurity Vector Mesh -->
  <g stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1" fill="none">
    <!-- Orbital Nodes & Hex Matrix -->
    <polygon points="150,60 220,100 220,180 150,220 80,180 80,100" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1.5" />
    <polygon points="150,80 200,110 200,170 150,200 100,170 100,110" stroke="#8b5cf6" stroke-opacity="0.4" />
    <line x1="150" y1="60" x2="150" y2="220" stroke-dasharray="3,3" stroke-opacity="0.2" />
    <line x1="80" y1="140" x2="220" y2="140" stroke-dasharray="3,3" stroke-opacity="0.2" />

    <!-- Center Radar & Perimeter Conduits -->
    <circle cx="600" cy="200" r="140" stroke="#00f0ff" stroke-opacity="0.12" stroke-dasharray="6,6" />
    <circle cx="600" cy="200" r="90" stroke="#8b5cf6" stroke-opacity="0.18" />
    <circle cx="600" cy="200" r="40" stroke="#10b981" stroke-opacity="0.25" />
    <line x1="420" y1="200" x2="780" y2="200" stroke="#00f0ff" stroke-opacity="0.15" />
    <line x1="600" y1="50" x2="600" y2="350" stroke="#00f0ff" stroke-opacity="0.15" />

    <!-- Right Side Constellation Nodes -->
    <polygon points="1050,80 1120,120 1120,200 1050,240 980,200 980,120" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.5" />
    <line x1="900" y1="160" x2="980" y2="160" stroke="#00f0ff" stroke-opacity="0.3" />
    <line x1="1050" y1="240" x2="1100" y2="310" stroke="#10b981" stroke-opacity="0.3" />
    <circle cx="1100" cy="310" r="4" fill="#10b981" fill-opacity="0.6" />
    <circle cx="900" cy="160" r="3" fill="#00f0ff" fill-opacity="0.8" />
  </g>

  <!-- Glowing Telemetry Lines -->
  <path d="M 0,320 Q 300,280 600,340 T 1200,300" fill="none" stroke="#00f0ff" stroke-opacity="0.2" stroke-width="2" />
  <path d="M 0,340 Q 350,380 700,320 T 1200,360" fill="none" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Data Pulse Marks -->
  <g fill="#00f0ff" opacity="0.6">
    <rect x="580" y="40" width="40" height="2" />
    <rect x="580" y="358" width="40" height="2" />
    <rect x="40" y="198" width="2" height="40" />
    <rect x="1158" y="198" width="2" height="40" />
  </g>
</svg>
