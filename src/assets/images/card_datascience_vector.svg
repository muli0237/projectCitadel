<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="datasci-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031417" />
      <stop offset="100%" stop-color="#062228" />
    </linearGradient>
    <pattern id="sci-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <rect width="400" height="160" fill="url(#datasci-grad)" />
  <rect width="400" height="160" fill="url(#sci-grid)" />

  <!-- Neural Graph / Data Tensor Matrix -->
  <g transform="translate(200, 75)">
    <!-- Concentric Target Arcs -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-dasharray="5,5" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00f0ff" stroke-opacity="0.3" stroke-dasharray="3,3" />

    <!-- Matrix Scatter Points & Vector Conduits -->
    <!-- Input Layer -->
    <circle cx="-80" cy="-25" r="4" fill="#10b981" />
    <circle cx="-80" cy="0" r="4" fill="#10b981" />
    <circle cx="-80" cy="25" r="4" fill="#10b981" />

    <!-- Hidden / Embedding Layer -->
    <circle cx="-25" cy="-35" r="5" fill="#00f0ff" />
    <circle cx="-25" cy="15" r="5" fill="#00f0ff" />
    <circle cx="25" cy="-15" r="5" fill="#00f0ff" />
    <circle cx="25" cy="35" r="5" fill="#00f0ff" />

    <!-- Output / Model Weights -->
    <circle cx="80" cy="-10" r="6" fill="#10b981" />
    <circle cx="80" cy="20" r="6" fill="#10b981" />

    <!-- Interconnecting Weights -->
    <line x1="-80" y1="-25" x2="-25" y2="-35" stroke="#10b981" stroke-opacity="0.4" />
    <line x1="-80" y1="0" x2="-25" y2="-35" stroke="#10b981" stroke-opacity="0.4" />
    <line x1="-80" y1="0" x2="-25" y2="15" stroke="#10b981" stroke-opacity="0.4" />
    <line x1="-80" y1="25" x2="-25" y2="15" stroke="#10b981" stroke-opacity="0.4" />

    <line x1="-25" y1="-35" x2="25" y2="-15" stroke="#00f0ff" stroke-opacity="0.5" />
    <line x1="-25" y1="15" x2="25" y2="-15" stroke="#00f0ff" stroke-opacity="0.5" />
    <line x1="-25" y1="15" x2="25" y2="35" stroke="#00f0ff" stroke-opacity="0.5" />

    <line x1="25" y1="-15" x2="80" y2="-10" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.5" />
    <line x1="25" y1="35" x2="80" y2="20" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.5" />

    <!-- Tensor Coordinate Axis -->
    <line x1="-120" y1="45" x2="120" y2="45" stroke="#10b981" stroke-opacity="0.3" />
    <path d="M -100,45 Q -50,30 0,40 T 100,20" fill="none" stroke="#00f0ff" stroke-width="1.5" />
  </g>

  <!-- Technical Corner Accents -->
  <path d="M 8,20 L 8,8 L 20,8" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 392,20 L 392,8 L 380,8" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 8,140 L 8,152 L 20,152" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 392,140 L 392,152 L 380,152" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
