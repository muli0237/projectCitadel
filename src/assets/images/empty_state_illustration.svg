  <circle cx="160" cy="95" r="55" stroke="#0e3352" stroke-width="1.5" stroke-dasharray="4 6" />
  <circle cx="160" cy="95" r="38" stroke="#0e3352" stroke-width="1" />
  <circle cx="160" cy="95" r="20" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="160" cy="95" r="55" fill="url(#cyanGlow)" />

  <!-- Reticle crosshairs -->
  <line x1="160" y1="30" x2="160" y2="160" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="95" y1="95" x2="225" y2="95" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3" />

