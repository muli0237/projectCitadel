<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="emptyBg" x1="0" y1="0" x2="320" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040b17" />
      <stop offset="100%" stop-color="#02050d" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="160" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="320" height="200" fill="url(#emptyBg)" rx="6" />

  <!-- Technical grid -->
  <path d="M20 40h280M20 80h280M20 120h280M20 160h280" stroke="#0e2238" stroke-width="1" stroke-dasharray="2 4" />
  <path d="M40 20v160M80 20v160M120 20v160M160 20v160M200 20v160M240 20v160M280 20v160" stroke="#0e2238" stroke-width="1" stroke-dasharray="2 4" />

