  <circle cx="160" cy="95" r="4" fill="#06b6d4" />
  <circle cx="160" cy="95" r="8" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6" />

  <!-- Status indicator text -->
  <text x="160" y="172" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10" letter-spacing="1.5">
