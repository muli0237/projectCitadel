<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="monGrad" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050e24" />
      <stop offset="50%" stop-color="#091b3b" />
      <stop offset="100%" stop-color="#030713" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#monGrad)" rx="8" />

  <!-- Waveform / Oscilloscope Grid -->
  <path d="M20 40h360M20 80h360M20 120h360M20 160h360M20 200h360" stroke="#0ea5e9" stroke-opacity="0.15" stroke-width="1" />
  <path d="M50 20v200M110 20v200M170 20v200M230 20v200M290 20v200M350 20v200" stroke="#0ea5e9" stroke-opacity="0.15" stroke-width="1" />

  <!-- Core Activity Grid 8 cores -->
  <g transform="translate(30, 30)">
    <rect width="70" height="24" rx="2" fill="#040b1a" stroke="#0ea5e9" stroke-opacity="0.4" />
    <text x="6" y="16" fill="#38bdf8" font-family="monospace" font-size="8">C0: 18%</text>
    <rect x="42" y="7" width="22" height="10" rx="1" fill="#0284c7" />

    <rect x="75" width="70" height="24" rx="2" fill="#040b1a" stroke="#0ea5e9" stroke-opacity="0.4" />
    <text x="81" y="16" fill="#38bdf8" font-family="monospace" font-size="8">C1: 42%</text>
    <rect x="117" y="7" width="22" height="10" rx="1" fill="#0284c7" />

    <rect x="150" width="70" height="24" rx="2" fill="#040b1a" stroke="#0ea5e9" stroke-opacity="0.4" />
    <text x="156" y="16" fill="#38bdf8" font-family="monospace" font-size="8">C2: 8%</text>
    <rect x="192" y="7" width="22" height="10" rx="1" fill="#0284c7" />

    <rect x="225" width="70" height="24" rx="2" fill="#040b1a" stroke="#0ea5e9" stroke-opacity="0.4" />
    <text x="231" y="16" fill="#34d399" font-family="monospace" font-size="8">C3: 71%</text>
    <rect x="267" y="7" width="22" height="10" rx="1" fill="#10b981" />
  </g>

  <!-- Telemetry Waveform -->
  <path d="M30 150 Q 70 120, 110 145 T 190 110 T 270 160 T 350 130 L 370 135" stroke="#38bdf8" stroke-width="2.5" fill="none" />
  <path d="M30 150 Q 70 120, 110 145 T 190 110 T 270 160 T 350 130 L 370 135 L 370 210 L 30 210 Z" fill="#38bdf8" fill-opacity="0.08" />

  <!-- Secondary Memory Waveform -->
  <path d="M30 170 Q 80 180, 130 160 T 230 150 T 330 180 L 370 175" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 2" fill="none" />

  <text x="35" y="222" fill="#64748b" font-family="monospace" font-size="8">CPU LOAD FREQ: 3.8 GHz • GOVERNOR: PERFORMANCE • THERMALS: 44°C NOMINAL</text>
</svg>
